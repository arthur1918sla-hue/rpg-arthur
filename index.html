<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane RPG Companion</title>
    <style>
        :root {
            --bg-deep: #07050f;
            --bg-card: #130d22;
            --border-arcane: #3b2859;
            --accent-purple: #9333ea;
            --accent-purple-hover: #7e22ce;
            --accent-purple-light: #c084fc;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, #1e1138 0%, #07050f 70%);
        }

        header {
            background-color: var(--bg-card);
            border-bottom: 2px solid var(--border-arcane);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        h1 {
            font-size: 1.3rem;
            color: var(--accent-purple-light);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Sistema de Abas / Menus */
        .nav-tabs {
            display: flex;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-arcane);
            padding: 0 1.5rem;
            gap: 0.5rem;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.8rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-main);
        }

        .tab-btn.active {
            color: var(--accent-purple-light);
            border-bottom-color: var(--accent-purple);
            background: rgba(147, 51, 234, 0.08);
        }

        .container {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-arcane);
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .card h2 {
            font-size: 1.05rem;
            margin-bottom: 1rem;
            color: var(--accent-purple-light);
            border-bottom: 1px solid var(--border-arcane);
            padding-bottom: 0.4rem;
            letter-spacing: 0.5px;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }

        .form-group { margin-bottom: 0.8rem; }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            background-color: #040308;
            border: 1px solid var(--border-arcane);
            border-radius: 6px;
            padding: 0.6rem;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 8px rgba(147, 51, 234, 0.3);
        }

        button.btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), #581c87);
            color: white;
            border: 1px solid #a855f7;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.btn-primary:hover {
            background: linear-gradient(135deg, #7e22ce, #6b21a8);
        }

        /* Atributos */
        .attr-box {
            background-color: #040308;
            border: 1px solid var(--border-arcane);
            border-radius: 8px;
            padding: 0.6rem;
            text-align: center;
        }

        .attr-box input {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 0.2rem;
            color: var(--accent-purple-light);
        }

        .mod-val {
            font-size: 0.8rem;
            color: var(--success);
            margin-top: 0.2rem;
            font-weight: bold;
        }

        /* XP Barra */
        .xp-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            background: #040308;
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border-arcane);
        }
        .xp-bar-bg {
            flex: 1;
            background: #1a1528;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .xp-bar-fill {
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-purple-light));
            height: 100%;
            width: 25%;
            transition: width 0.3s;
        }
        .xp-btns { display: flex; gap: 0.3rem; }
        .xp-btns button { padding: 0.2rem 0.5rem; font-size: 0.8rem; background: var(--border-arcane); color: white; border: none; border-radius: 4px; cursor: pointer; }

        /* Dados & Log */
        .dice-panel { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .dice-btn {
            background-color: #040308;
            border: 1px solid var(--border-arcane);
            color: var(--accent-purple-light);
            flex: 1;
            min-width: 60px;
            padding: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            text-align: center;
        }
        .dice-btn:hover { border-color: var(--accent-purple); background: #1a102f; }

        .custom-dice-box {
            background: #040308;
            border: 1px solid var(--border-arcane);
            padding: 0.8rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .log-box {
            background-color: #040308;
            border: 1px solid var(--border-arcane);
            border-radius: 6px;
            padding: 0.8rem;
            height: 200px;
            overflow-y: auto;
            font-size: 0.95rem;
            font-family: monospace;
            color: #d1d5db;
        }

        /* Inventário & Dinheiro */
        .money-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .money-box {
            background: #040308;
            border: 1px solid var(--border-arcane);
            padding: 0.5rem;
            border-radius: 6px;
            text-align: center;
        }
        .money-box input {
            text-align: center;
            font-weight: bold;
            color: var(--accent-purple-light);
            padding: 0.3rem;
            margin-top: 0.2rem;
        }

        .inventory-list { list-style: none; margin-top: 0.8rem; }
        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #040308;
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border-arcane);
        }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 0.3rem 0.6rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>📜 Arcane Companion</h1>
        <button class="btn-primary" onclick="salvarDados()">Salvar Ficha</button>
    </header>

    <!-- Menu de Abas -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="abrirAba('ficha', event)">⚔️ Ficha & Atributos</button>
        <button class="tab-btn" onclick="abrirAba('dados', event)">🎲 Rolador de Dados</button>
        <button class="tab-btn" onclick="abrirAba('inventario', event)">🎒 Inventário & Notas</button>
    </div>

    <div class="container">
        <!-- ABA 1: FICHA & ATRIBUTOS -->
        <div id="pane-ficha" class="tab-pane active">
            <div class="card">
                <h2>Identidade do Personagem</h2>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="charName" placeholder="Ex: Vaelonor">
                    </div>
                    <div class="form-group">
                        <label>Raça</label>
                        <input type="text" id="charRace" placeholder="Ex: Humano, Elfo...">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Classe Principal</label>
                        <select id="charClass" onchange="atualizarSubclasses()">
                            <option value="Mago">Mago</option>
                            <option value="Guerreiro">Guerreiro</option>
                            <option value="Ladino">Ladino</option>
                            <option value="Clérigo">Clérigo</option>
                            <option value="Bruxo">Bruxo</option>
                            <option value="Patrulheiro">Patrulheiro</option>
                            <option value="Outro">Outro / Customizado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Subclasse</label>
                        <select id="charSubclass">
                            <option value="Transmutador">Escola de Transmutação (Transmuter)</option>
                            <option value="Evocador">Escola de Evocação</option>
                            <option value="Necromante">Escola de Necromancia</option>
                            <option value="Abjurador">Escola de Abjuração</option>
                        </select>
                    </div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Nível</label>
                        <input type="number" id="charLevel" value="1" min="1" max="20">
                    </div>
                    <div class="form-group">
                        <label>HP Máx/Atual</label>
                        <input type="text" id="charHp" value="20/20">
                    </div>
                    <div class="form-group">
                        <label>Armadura (CA)</label>
                        <input type="number" id="charAc" value="12">
                    </div>
                </div>

                <div class="form-group">
                    <label>Progresso de Nível / Experiência</label>
                    <div class="xp-container">
                        <div class="xp-bar-bg">
                            <div class="xp-bar-fill" id="xpBarFill" style="width: 25%;"></div>
                        </div>
                        <span id="xpText" style="font-size: 0.8rem; min-width: 45px; text-align: right; color: var(--accent-purple-light);">Est. 1/4</span>
                        <div class="xp-btns">
                            <button onclick="mudarXp(-1)">-</button>
                            <button onclick="mudarXp(1)">+</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Atributos</h2>
                <div class="grid-3">
                    <div class="attr-box">
                        <label>Força</label>
                        <input type="number" id="attrStr" value="10" onchange="calcularMods()">
                        <div class="mod-val" id="modStr">+0</div>
                    </div>
                    <div class="attr-box">
                        <label>Destreza</label>
                        <input type="number" id="attrDex" value="10" onchange="calcularMods()">
                        <div class="mod-val" id="modDex">+0</div>
                    </div>
                    <div class="attr-box">
                        <label>Constituição</label>
                        <input type="number" id="attrCon" value="10" onchange="calcularMods()">
                        <div class="mod-val" id="modCon">+0</div>
                    </div>
                    <div class="attr-box">
                        <label>Inteligência</label>
                        <input type="number" id="attrInt" value="10" onchange="calcularMods()">
                        <div class="mod-val" id="modInt">+0</div>
                    </div>
                    <div class="attr-box">
                        <label>Sabedoria</label>
                        <input type="number" id="attrWis" value="10" onchange="calcularMods()">
                        <div class="mod-val" id="modWis">+0</div>
                    </div>
                    <div class="attr-box">
                        <label>Carisma</label>
                        <input type="number" id="attrCha" value="10" onchange="calcularMods()">
                        <div class="mod-val" id="modCha">+0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ABA 2: ROLADOR DE DADOS -->
        <div id="pane-dados" class="tab-pane">
            <div class="card">
                <h2>Rolador de Dados Rápido</h2>
                <div class="dice-panel">
                    <button class="dice-btn" onclick="rolarDado(4)">d4</button>
                    <button class="dice-btn" onclick="rolarDado(6)">d6</button>
                    <button class="dice-btn" onclick="rolarDado(8)">d8</button>
                    <button class="dice-btn" onclick="rolarDado(10)">d10</button>
                    <button class="dice-btn" onclick="rolarDado(12)">d12</button>
                    <button class="dice-btn" onclick="rolarDado(20)">d20</button>
                    <button class="dice-btn" onclick="rolarDado(100)">d100</button>
                </div>

                <h2>Rolagem Customizada (Modificável)</h2>
                <div class="custom-dice-box">
                    <div class="grid-3" style="margin-bottom: 0.8rem;">
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Qtd. Dados</label>
                            <input type="number" id="customQtd" value="1" min="1" max="20">
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Tipo (Lados)</label>
                            <select id="customLados">
                                <option value="4">d4</option>
                                <option value="6">d6</option>
                                <option value="8">d8</option>
                                <option value="10">d10</option>
                                <option value="12">d12</option>
                                <option value="20" selected>d20</option>
                                <option value="100">d100</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <label>Modificador (+ / -)</label>
                            <input type="number" id="customMod" value="0">
                        </div>
                    </div>
                    <button class="btn-primary" onclick="rolarCustomizado()" style="width: 100%;">Rolar Dados Customizados</button>
                </div>

                <label>Histórico de Rolagens</label>
                <div class="log-box" id="diceLog">Pronto para rolar...<br></div>
            </div>
        </div>

        <!-- ABA 3: INVENTÁRIO & NOTAS -->
        <div id="pane-inventario" class="tab-pane">
            <div class="card">
                <h2>Carteira / Dinheiro</h2>
                <div class="money-grid">
                    <div class="money-box">
                        <label>PC (Cobre)</label>
                        <input type="number" id="coinCP" value="0" min="0">
                    </div>
                    <div class="money-box">
                        <label>PP (Prata)</label>
                        <input type="number" id="coinSP" value="0" min="0">
                    </div>
                    <div class="money-box">
                        <label>PO (Ouro)</label>
                        <input type="number" id="coinGP" value="10" min="0">
                    </div>
                    <div class="money-box">
                        <label>PP (Platina)</label>
                        <input type="number" id="coinPP" value="0" min="0">
                    </div>
                </div>

                <h2>Inventário & Equipamentos</h2>
                <div class="grid-2">
                    <input type="text" id="newItemName" placeholder="Nome do item ou arma">
                    <button class="btn-primary" onclick="adicionarItem()">Adicionar</button>
                </div>
                <ul class="inventory-list" id="inventoryList">
                    <!-- Itens aparecem aqui -->
                </ul>
            </div>

            <div class="card">
                <h2>Notas & Lore da Campanha</h2>
                <textarea id="sessionNotes" rows="5" placeholder="Anotações importantes sobre a sessão, missões e segredos..."></textarea>
            </div>
        </div>
    </div>

    <script>
        // Função para Alternar Abas (Menus)
        function abrirAba(nomeAba, event) {
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById('pane-' + nomeAba).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Subclasses Dinâmicas
        const subclassesMap = {
            "Mago": ["Escola de Transmutação (Transmuter)", "Escola de Evocação", "Escola de Necromancia", "Escola de Abjuração"],
            "Guerreiro": ["Mestre de Batalha", "Cavaleiro Eldritch", "Campeão"],
            "Ladino": ["Assassino", "Ladrão", "Tristeza Arcana"],
            "Clérigo": ["Domínio da Vida", "Domínio da Luz", "Domínio da Guerra"],
            "Bruxo": ["O Corruptor", "O Arqfada", "O Grande Antigo"],
            "Patrulheiro": ["Caçador", "Senhor das Feras"],
            "Outro": ["Customizado"]
        };

        function atualizarSubclasses() {
            const classeSelect = document.getElementById('charClass');
            const subclassSelect = document.getElementById('charSubclass');
            const classeEscolhida = classeSelect.value;
            
            subclassSelect.innerHTML = '';
            const opcoes = subclassesMap[classeEscolhida] || ["Padrão"];
            opcoes.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subclassSelect.appendChild(opt);
            });
        }

        // XP Simplificado
        let xpEstagio = 1;
        function mudarXp(valor) {
            xpEstagio += valor;
            if (xpEstagio < 0) xpEstagio = 0;
            if (xpEstagio > 4) xpEstagio = 4;
            
            const porcentagens = [0, 25, 50, 75, 100];
            document.getElementById('xpBarFill').style.width = porcentagens[xpEstagio] + '%';
            document.getElementById('xpText').innerText = `Est. ${xpEstagio}/4`;
        }

        // Modificadores
        function calcularMods() {
            const attrs = ['Str', 'Dex', 'Con', 'Int', 'Wis', 'Cha'];
            attrs.forEach(attr => {
                const val = parseInt(document.getElementById('attr' + attr).value) || 10;
                const mod = Math.floor((val - 10) / 2);
                document.getElementById('mod' + attr).innerText = (mod >= 0 ? '+' : '') + mod;
            });
        }

        // Rolador de Dados Rápido
        function rolarDado(lados) {
            const resultado = Math.floor(Math.random() * lados) + 1;
            const logBox = document.getElementById('diceLog');
            const timestamp = new Date().toLocaleTimeString();
            logBox.innerHTML = `[${timestamp}] d${lados} ➔ <b>${resultado}</b><br>` + logBox.innerHTML;
        }

        // Rolador de Dados Customizado (Qtd + Lados + Modificador)
        function rolarCustomizado() {
            const qtd = parseInt(document.getElementById('customQtd').value) || 1;
            const lados = parseInt(document.getElementById('customLados').value) || 20;
            const mod = parseInt(document.getElementById('customMod').value) || 0;

            let total = 0;
            let rolagens = [];

            for (let i = 0; i < qtd; i++) {
                const r = Math.floor(Math.random() * lados) + 1;
                rolagens.push(r);
                total += r;
            }

            total += mod;
            const timestamp = new Date().toLocaleTimeString();
            const modTexto = mod !== 0 ? (mod > 0 ? ` +${mod}` : ` ${mod}`) : '';
            const detalheRolagens = qtd > 1 ? ` (${rolagens.join(', ')})` : '';

            const logBox = document.getElementById('diceLog');
            logBox.innerHTML = `[${timestamp}] ${qtd}d${lados}${modTexto} ➔ <b>${total}</b>${detalheRolagens}<br>` + logBox.innerHTML;
        }

        // Inventário & Dinheiro
        let inventario = [];
        function adicionarItem() {
            const input = document.getElementById('newItemName');
            if (input.value.trim() === '') return;
            inventario.push(input.value);
            input.value = '';
            atualizarInventario();
        }

        function removerItem(index) {
            inventario.splice(index, 1);
            atualizarInventario();
        }

        function atualizarInventario() {
            const list = document.getElementById('inventoryList');
            list.innerHTML = '';
            inventario.forEach((item, index) => {
                list.innerHTML += `
                    <li class="inventory-item">
                        <span>${item}</span>
                        <button class="delete-btn" onclick="removerItem(${index})">X</button>
                    </li>`;
            });
        }

        // Salvamento Local
        function salvarDados() {
            const dados = {
                name: document.getElementById('charName').value,
                race: document.getElementById('charRace').value,
                classe: document.getElementById('charClass').value,
                subclass: document.getElementById('charSubclass').value,
                level: document.getElementById('charLevel').value,
                hp: document.getElementById('charHp').value,
                ac: document.getElementById('charAc').value,
                xp: xpEstagio,
                attrs: {
                    str: document.getElementById('attrStr').value,
                    dex: document.getElementById('attrDex').value,
                    con: document.getElementById('attrCon').value,
                    int: document.getElementById('attrInt').value,
                    wis: document.getElementById('attrWis').value,
                    cha: document.getElementById('attrCha').value,
                },
                coins: {
                    cp: document.getElementById('coinCP').value,
                    sp: document.getElementById('coinSP').value,
                    gp: document.getElementById('coinGP').value,
                    pp: document.getElementById('coinPP').value
                },
                inventario: inventario,
                notes: document.getElementById('sessionNotes').value
            };
            localStorage.setItem('arcane_rpg_save', JSON.stringify(dados));
            alert('Ficha salva com sucesso!');
        }

        function carregarDados() {
            const salvo = localStorage.getItem('arcane_rpg_save');
            if (!salvo) return;
            const dados = JSON.parse(salvo);
            document.getElementById('charName').value = dados.name || '';
            document.getElementById('charRace').value = dados.race || '';
            if (dados.classe) {
                document.getElementById('charClass').value = dados.classe;
                atualizarSubclasses();
            }
            if (dados.subclass) {
                document.getElementById('charSubclass').value = dados.subclass;
            }
            document.getElementById('charLevel').value = dados.level || '1';
            document.getElementById('charHp').value = dados.hp || '20/20';
            document.getElementById('charAc').value = dados.ac || '12';
            
            if (dados.xp !== undefined) {
                xpEstagio = dados.xp;
                const porcentagens = [0, 25, 50, 75, 100];
                document.getElementById('xpBarFill').style.width = porcentagens[xpEstagio] + '%';
                document.getElementById('xpText').innerText = `Est. ${xpEstagio}/4`;
            }

            if (dados.attrs) {
                document.getElementById('attrStr').value = dados.attrs.str || 10;
                document.getElementById('attrDex').value = dados.attrs.dex || 10;
                document.getElementById('attrCon').value = dados.attrs.con || 10;
                document.getElementById('attrInt').value = dados.attrs.int || 10;
                document.getElementById('attrWis').value = dados.attrs.wis || 10;
                document.getElementById('attrCha').value = dados.attrs.cha || 10;
            }

            if (dados.coins) {
                document.getElementById('coinCP').value = dados.coins.cp || 0;
                document.getElementById('coinSP').value = dados.coins.sp || 0;
                document.getElementById('coinGP').value = dados.coins.gp || 0;
                document.getElementById('coinPP').value = dados.coins.pp || 0;
            }

            inventario = dados.inventario || [];
            document.getElementById('sessionNotes').value = dados.notes || '';
            calcularMods();
            atualizarInventario();
        }

        window.onload = carregarDados;
    </script>
</body>
</html>
